name: Deploy Hidden Gem Website

on:
  push:
    branches:
      - test-website
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: hidden-gem-frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4